<div class="content_carrinho column">

    <div class="car_btn_close" onclick="change_overlay()">
        <i class="ri-close-line"></i>
    </div>

    <div class="row center">
        <strong>Meu Pedido</strong>
    </div>

    <div class="lista_produtos">

        {% for produto in range(3) %}
        <div class="iten_produtos row">
            <div class="row2">
                <img src="{{ url_for('static', filename='img/produto.jpeg') }}" alt="">
                <div class="infos column">
                    <div class="row">
                        <strong>Nome do produto (x2)</strong>
                    </div>
                    <span>2.500,00</span>
                </div>
            </div>
            <div class="button">
                <i class="ri-delete-bin-line"></i>
            </div>
        </div>
        {% endfor %}

    </div>

    <div class="row">
        <div class="row2">
            <strong>Total:</strong>
            <strong>8,450,00</strong>
        </div>
        <div class="button">
            <span>Enviar Pedido</span>
            <i class="ri-send-plane-line"></i>
        </div>
    </div>

</div>
