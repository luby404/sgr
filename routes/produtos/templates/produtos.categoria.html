<div class="modal">

    <div class="column">
        <div class="row">
            <strong>Categorias</strong>

            <div class="btn_close button" onclick="change_overlay()">
                <i class="ri-close-line"></i>
            </div>
        </div>

        <form action="" class="row2" hx-post="{{ url_for('produtos.categoria' ) }}" hx-trigger="submit" hx-target="#overlay">
            <div class="entry column">
                <input type="text" name="categoria" required class="input" placeholder="Nome da categoria">
            </div>
            <button class="button">
                <span>Adicionar</span>
            </button>
        </form>

        <div class="table">
            <table style="min-width: 200px;">
                <thead>
                    <tr>
                        <td>Nome</td>
                        <td></td>
                    </tr>
                </thead>
                <tbody>
                    {% for categoria in dados.categorias %}
                        <tr>
                            <td>{{ categoria.nome }}</td>
                            <td>
                                <div class="row2">
                                    <div class="button">
                                        <i class="ri-edit-line"></i>
                                    </div>
                                    <div class="button" hx-confirm="Tem a certeza que deseja eliminar?" hx-put="{{ url_for('produtos.categoria', id=categoria.id ) }}" hx-target="#overlay">
                                        <i class="ri-delete-bin-line"></i>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

</div>
