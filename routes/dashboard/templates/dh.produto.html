<div class="row">
    <div class="column" style="gap: 5px;">
        <strong>Gestão Produtos</strong>
        <span>Gerencie seus produtos na velocidade so som</span>
    </div>

    <div class="row2">
        <div class="button" 
        onclick="change_overlay()" 
        hx-get="{{ url_for('produtos.index', name='new' ) }}" 
        hx-target="#overlay"
        >
            <i class="ri-add-line"></i>
            <span>Novo Produto</span>
        </div>
        <a href="" class="button">
            <i class="ri-file-list-line"></i>
            <span>Categorias</span>
        </a>
    </div>
</div>

<div class="table">

    <table>
        <thead>
            <tr>
                <td>Nome do produto</td>
                <td>Preço de venda</td>
                <td>Status do produto</td>
                <td>Acções</td>
            </tr>
        </thead>
        <tbody>

            {% for produto in range(10) %}
            <tr>
                <td>
                    <div class="row2">
                        <img class="table_image" src="{{ url_for('static', filename='img/produto.jpeg') }}" alt="">
                        <span>Nome do produto</span>
                    </div>
                </td>
                <td>850,00</td>
                <td>
                    <div class="status ative">
                        <span>Ativo</span>
                    </div>
                </td>
                <td>
                    <div class="row2">
                        <a href="" class="button">
                            <i class="ri-edit-line"></i>
                        </a>
                        <a href="" class="button">
                            <i class="ri-delete-bin-line"></i>
                        </a>
                    </div>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>

</div>
